name: Deploy to GitHub Pages

# Only main is published. Work lands on pre-production first; merging it into
# main is the act of publishing, so students never see a half-finished feature.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      # The site is plain static files served from the repository root, so there
      # is nothing to build yet. When the React port lands, replace this step
      # with the build and point `path` at the output directory (e.g. ./dist).
      - name: Write deployment marker
        run: |
          cat > deployment.json <<EOF
          {
            "sha": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}"
          }
          EOF
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
