name: Deploy to GitHub Pages

# Only main is published. Work lands on pre-production first; merging it into
# main is the act of publishing, so students never see a half-finished feature.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is plain static files served from the repository root, so there
      # is nothing to build yet. When the React port lands, replace this step
      # with the build and point `path` at the output directory (e.g. ./dist).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
